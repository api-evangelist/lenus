aid: lenus
name: Lenus eHealth
description: 'Lenus eHealth is a Copenhagen-headquartered health and fitness technology company that
  builds a coaching platform for online health and fitness coaches, positioning itself as a growth
  partner rather than a consumer fitness app. Coaching partners run their businesses through the Lenus
  web dashboard and branded consumer mobile apps: client onboarding and screening, training and
  nutrition programming, habit and progress tracking, in-app messaging, content delivery, subscription
  billing and business analytics. The company also operates Lenus Academy, a certified education
  program for online coaches, and in the United States offers a GLP-1 weight management program
  delivered with independent medical partner Beluga Health. Lenus operates from 20+ offices including
  Copenhagen, Berlin, London, Amsterdam, Stockholm, Madrid, New York and Toronto, and is backed by EQT
  Ventures. The platform is closed and invitation-based: as of July 2026 Lenus publishes no public API,
  developer portal, SDKs or machine-readable API specifications, and access is available only to
  coaching partners under a partnership agreement.'
